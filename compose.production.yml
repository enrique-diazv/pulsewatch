name: pulsewatch

x-backend-environment: &backend-environment
  APP_NAME: PulseWatch API
  APP_VERSION: 0.1.0
  ENVIRONMENT: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  CORS_ALLOWED_ORIGINS: '["${APP_ORIGIN:?Set APP_ORIGIN}"]'
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: pulsewatch
  DATABASE_USER: pulsewatch_app
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-log}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-alerts@pulsewatch.local}
  SMTP_HOST: ${SMTP_HOST:-smtp}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_START_TLS: ${SMTP_START_TLS:-false}

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pulsewatch
      POSTGRES_USER: pulsewatch_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pulsewatch_app -d pulsewatch
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    healthcheck:
      disable: true
    <<: *backend-service
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    command:
      - sh
      - -c
      - >-
        exec python -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${WEB_CONCURRENCY:-2}
        --proxy-headers
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/health",
          timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend-service
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=monitoring,notifications
      - --concurrency=${WORKER_CONCURRENCY:-4}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend-service
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: