[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["."]
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"