name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENVIRONMENT: testing
      LOG_LEVEL: WARNING
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: pulsewatch
      DATABASE_USER: pulsewatch_app
      DATABASE_PASSWORD: pulsewatch-ci-password
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: pulsewatch-ci-jwt-secret-key-at-least-32-characters
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pulsewatch
          POSTGRES_USER: pulsewatch_app
          POSTGRES_PASSWORD: pulsewatch-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsewatch_app -d pulsewatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

  backend-image:
    name: Backend container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: >
          docker build
          --file backend/Dockerfile
          --tag pulsewatch-backend:ci
          backend

      - name: Inspect image runtime user
        run: >
          test
          "$(docker image inspect
          pulsewatch-backend:ci
          --format '{{.Config.User}}')"
          = "pulsewatch"

  frontend-image:
    name: Frontend container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build frontend image
        run: >
          docker build
          --file frontend/Dockerfile
          --tag pulsewatch-frontend:ci
          frontend

      - name: Inspect image runtime user
        run: >
          test
          "$(docker image inspect
          pulsewatch-frontend:ci
          --format '{{.Config.User}}')"
          = "nginx"

  production-compose:
    name: Production Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APP_ORIGIN: https://pulsewatch.example.com
      DATABASE_PASSWORD: pulsewatch-compose-ci-password
      JWT_SECRET_KEY: pulsewatch-compose-ci-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate production Compose
        run: >
          docker compose
          --file compose.production.yml
          config
          --quiet

  production-stack:
    name: Production stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-image
      - frontend-image
      - production-compose

    env:
      APP_ORIGIN: http://127.0.0.1:8080
      APP_PORT: "8080"
      DATABASE_PASSWORD: pulsewatch-stack-ci-password
      JWT_SECRET_KEY: pulsewatch-stack-ci-secret-at-least-32-characters
      WEB_CONCURRENCY: "2"
      WORKER_CONCURRENCY: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start production stack
        run: >
          docker compose
          --file compose.production.yml
          up
          --detach
          --build

      - name: Wait for frontend health
        shell: bash
        run: |
          for attempt in {1..60}; do
              if curl \
                  --fail \
                  --silent \
                  http://127.0.0.1:8080/health
              then
                  exit 0
              fi

              sleep 2
          done

          exit 1

      - name: Verify API, proxy, and database
        run: >
          curl
          --fail
          --silent
          --show-error
          --request POST
          --header "Content-Type: application/json"
          --data
          '{"email":"compose-smoke@example.com","password":"pulsewatch-smoke"}'
          http://127.0.0.1:8080/api/v1/auth/register

      - name: Show service status
        if: always()
        run: >
          docker compose
          --file compose.production.yml
          ps

      - name: Show service logs on failure
        if: failure()
        run: >
          docker compose
          --file compose.production.yml
          logs
          --no-color

      - name: Stop production stack
        if: always()
        run: >
          docker compose
          --file compose.production.yml
          down
          --volumes
          --remove-orphans